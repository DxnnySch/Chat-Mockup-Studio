<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Mockup Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232563eb' d='M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/ai.css">
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/html-to-image.js"></script>
</head>
<body>
<header id="topbar">
  <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg><b>Chat Mockup Studio</b></div>
  <input id="projName" class="name-input" title="Project name" spellcheck="false">
  <div class="tb-group">
    <button id="btnUndo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button id="btnRedo" title="Redo (Ctrl+Y)">↷ Redo</button>
  </div>
  <div class="tb-group">
    <button id="zoomOut" title="Zoom out">−</button><span id="zoomLabel" class="zoom-label">100%</span><button id="zoomIn" title="Zoom in">+</button><button id="zoomFit" title="Fit to window">Fit</button>
  </div>
  <label class="tb-toggle" title="Hide selection outlines and annotation handles"><input type="checkbox" id="chkPreview"> Preview</label>
  <div class="tb-spacer"></div>
  <div class="menu" id="menuProject"><button class="menu-btn">Project ▾</button><div class="menu-pop"></div></div>
  <div class="menu" id="menuExport"><button class="menu-btn primary">Export ▾</button><div class="menu-pop"></div></div>
</header>
<main id="layout">
  <aside id="left" class="panel"></aside>
  <section id="viewport">
    <div id="scaler"><div id="stage" class="stage"></div></div>
  </section>
  <aside id="right" class="panel"></aside>
</main>
<div id="toast" role="status"></div>
<input type="file" id="fileOpen" accept="application/json,.json" hidden>
<script type="module" src="src/main.js"></script>
</body>
</html>
